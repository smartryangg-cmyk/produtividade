<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>BM Unit Midia</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>🔥 BM Unit Midia</strong>
    <input id="busca" type="search" placeholder="Buscar BM ou conta">
    <button id="atualizar" type="button" title="Recarregar">⟳</button>
  </header>

  <p id="status" role="status"></p>
  <main id="lista"></main>

  <details id="avancado">
    <summary>Token manual</summary>
    <div class="linha">
      <input id="token" type="password" placeholder="EAA..." autocomplete="off">
      <button id="usarToken" type="button">Usar</button>
    </div>
  </details>

  <template id="tplBM">
    <article class="bm">
      <div class="topo">
        <div>
          <h2></h2>
          <small class="sub"></small>
        </div>
        <span class="selo"></span>
      </div>
      <div class="resumo"></div>
      <table>
        <thead>
          <tr><th></th><th>Conta</th><th>Gastos</th><th>Limite</th><th>Lim. ext.</th><th>Ciclo</th><th>Dívida</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="acoes">
        <input class="codigo" placeholder="Código (A3290)">
        <input class="valor" placeholder="Valor (700)">
        <button class="copiar primario" type="button">Copiar mensagem</button>
      </div>
    </article>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
